name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # The tag is the source of truth: the version the workflow ships is the one the tag names,
      # not whatever the tree happened to contain. Guards against double-publishing a version.
      - name: Verify tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::package.json version $VERSION does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run package

      # Same script as locally, so both write the VSIX to artifacts/.
      - name: Package VSIX
        run: npm run vsix

      - name: Get VSIX filename
        id: vsix
        run: echo "file=$(ls artifacts/*.vsix)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.vsix.outputs.file }}
          generate_release_notes: true

      # Publishes to the VS Code Marketplace (https://marketplace.visualstudio.com/items?itemName=andreabruno.csharp-solution-explorer-community).
      # Requires the repository secret VSCE_PAT: a PAT with "Marketplace > Manage" scope from the
      # Azure DevOps account that owns the publisher 'andreabruno'. Set it with:
      #   gh secret set VSCE_PAT
      - name: Publish to VS Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath "${{ steps.vsix.outputs.file }}" -p "$VSCE_PAT"
